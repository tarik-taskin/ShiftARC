spring:
  application:
    name: shiftarc-api
  flyway:
    enabled: true
    default-schema: public
    table: flyway_schema_history
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
    fail-on-missing-locations: true
    out-of-order: false
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: shiftarc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SHIFTARC_API_PORT:8080}

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
