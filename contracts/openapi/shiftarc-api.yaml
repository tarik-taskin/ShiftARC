openapi: 3.1.0
info:
  title: ShiftARC API
  version: 0.1.0
  description: Contract for the local ShiftARC planning application API.
servers:
  - url: /
security: []
paths:
  /api/v1/categories:
    get:
      operationId: listCategories
      summary: List local workspace categories
      tags:
        - Categories
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          schema:
            type: string
            maxLength: 80
            default: ""
      responses:
        "200":
          description: Categories ordered by archive state and name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
    post:
      operationId: createCategory
      summary: Create a category
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/CategoryConflict"
  /api/v1/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    put:
      operationId: updateCategory
      summary: Update a category
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdateRequest"
      responses:
        "200":
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "409":
          $ref: "#/components/responses/CategoryConflict"
    delete:
      operationId: archiveCategory
      summary: Archive a category without deleting its history
      tags:
        - Categories
      parameters:
        - $ref: "#/components/parameters/EntityVersion"
      responses:
        "204":
          description: Category archived.
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "409":
          $ref: "#/components/responses/CategoryConflict"
  /api/v1/categories/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      operationId: restoreCategory
      summary: Restore an archived category
      tags:
        - Categories
      parameters:
        - $ref: "#/components/parameters/EntityVersion"
      responses:
        "200":
          description: Category restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "409":
          $ref: "#/components/responses/CategoryConflict"
  /api/v1/day-types:
    get:
      operationId: listDayTypes
      summary: List local workspace day types with their complete timelines
      tags: [Day types]
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Day types ordered by archive state and name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DayTypeResponse"
    post:
      operationId: createDayType
      summary: Create a day type with one full-day unplanned block
      tags: [Day types]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DayTypeCreateRequest"
      responses:
        "201":
          description: Day type created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayTypeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/DayTypeConflict"
  /api/v1/day-types/{id}:
    parameters:
      - $ref: "#/components/parameters/DayTypeId"
    put:
      operationId: updateDayType
      summary: Update day type metadata
      tags: [Day types]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DayTypeUpdateRequest"
      responses:
        "200":
          description: Day type updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayTypeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/DayTypeNotFound"
        "409":
          $ref: "#/components/responses/DayTypeConflict"
    delete:
      operationId: archiveDayType
      summary: Archive a day type without deleting its timeline
      tags: [Day types]
      parameters:
        - $ref: "#/components/parameters/EntityVersion"
      responses:
        "204":
          description: Day type archived.
        "404":
          $ref: "#/components/responses/DayTypeNotFound"
        "409":
          $ref: "#/components/responses/DayTypeConflict"
  /api/v1/day-types/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/DayTypeId"
    post:
      operationId: restoreDayType
      summary: Restore an archived day type
      tags: [Day types]
      parameters:
        - $ref: "#/components/parameters/EntityVersion"
      responses:
        "200":
          description: Day type restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayTypeResponse"
        "404":
          $ref: "#/components/responses/DayTypeNotFound"
        "409":
          $ref: "#/components/responses/DayTypeConflict"
  /api/v1/day-types/{id}/blocks:
    parameters:
      - $ref: "#/components/parameters/DayTypeId"
    put:
      operationId: replaceDayTypeBlocks
      summary: Replace a day type's complete 00:00–24:00 timeline
      tags: [Day types]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DayTypeBlocksUpdateRequest"
      responses:
        "200":
          description: Timeline updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayTypeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/DayTypeNotFound"
        "409":
          $ref: "#/components/responses/DayTypeConflict"
  /api/v1/weekly-plan:
    get:
      operationId: getWeeklyPlan
      summary: Get the recurring Monday-to-Sunday day type assignments
      tags: [Weekly plan]
      responses:
        "200":
          description: Seven weekday slots and their optional day type assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyPlanResponse"
    put:
      operationId: replaceWeeklyPlan
      summary: Atomically replace the recurring weekday assignments
      tags: [Weekly plan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyPlanUpdateRequest"
      responses:
        "200":
          description: Weekly plan saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyPlanResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/WeeklyPlanConflict"
  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: List and filter local workspace tasks
      tags: [Tasks]
      parameters:
        - { name: type, in: query, schema: { $ref: "#/components/schemas/TaskType" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TaskStatus" } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string, maxLength: 160, default: "" } }
        - name: sort
          in: query
          schema: { type: string, enum: [PRIORITY, DEADLINE, CREATED], default: PRIORITY }
      responses:
        "200":
          description: Filtered tasks.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TaskResponse" } }
    post:
      operationId: createTask
      summary: Create a work item or habit
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/TaskWriteRequest" } }
      responses:
        "201":
          description: Task created.
          content:
            application/json: { schema: { $ref: "#/components/schemas/TaskResponse" } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
  /api/v1/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateTask
      summary: Update task details
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/TaskWriteRequest" } }
      responses:
        "200":
          description: Task updated.
          content:
            application/json: { schema: { $ref: "#/components/schemas/TaskResponse" } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/TaskNotFound" }
        "409": { $ref: "#/components/responses/TaskConflict" }
  /api/v1/tasks/{id}/status/{status}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: status
        in: path
        required: true
        schema: { $ref: "#/components/schemas/TaskStatus" }
    post:
      operationId: setTaskStatus
      summary: Complete, archive, or reactivate a task
      tags: [Tasks]
      parameters:
        - { $ref: "#/components/parameters/EntityVersion" }
      responses:
        "200":
          description: Task status changed.
          content:
            application/json: { schema: { $ref: "#/components/schemas/TaskResponse" } }
        "404": { $ref: "#/components/responses/TaskNotFound" }
        "409": { $ref: "#/components/responses/TaskConflict" }
  /api/v1/daily-plan/today:
    get:
      operationId: getTodayPlan
      summary: Get or deterministically generate today's plan
      tags: [Daily plan]
      responses:
        "200":
          description: Today's persisted plan.
          content:
            application/json: { schema: { $ref: "#/components/schemas/DailyPlanResponse" } }
        "409": { $ref: "#/components/responses/DailyPlanConflict" }
  /api/v1/daily-plan/today/regenerate:
    post:
      operationId: regenerateTodayPlan
      summary: Regenerate today's future plan structure
      tags: [Daily plan]
      parameters:
        - { $ref: "#/components/parameters/EntityVersion" }
      responses:
        "200":
          description: Regenerated plan.
          content:
            application/json: { schema: { $ref: "#/components/schemas/DailyPlanResponse" } }
        "409": { $ref: "#/components/responses/DailyPlanConflict" }
  /api/v1/execution/today:
    get:
      operationId: getTodayExecution
      summary: Get today's active and completed execution sessions
      tags: [Execution]
      responses:
        "200":
          description: Today's execution state.
          content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionStateResponse" } } }
  /api/v1/execution/start:
    post:
      operationId: startExecution
      summary: Start a planned daily item
      tags: [Execution]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionStartRequest" } } }
      responses:
        "200": { description: Execution started., content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionStateResponse" } } } }
        "404": { $ref: "#/components/responses/ExecutionNotFound" }
        "409": { $ref: "#/components/responses/ExecutionConflict" }
  /api/v1/execution/finish:
    post:
      operationId: finishExecution
      summary: Finish the active execution
      tags: [Execution]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionFinishRequest" } } }
      responses:
        "200": { description: Execution finished., content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionStateResponse" } } } }
        "404": { $ref: "#/components/responses/ExecutionNotFound" }
        "409": { $ref: "#/components/responses/ExecutionConflict" }
  /api/v1/execution/transition:
    post:
      operationId: transitionExecution
      summary: Finish the active execution and start the next planned item atomically
      tags: [Execution]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionTransitionRequest" } } }
      responses:
        "200": { description: Execution transitioned., content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionStateResponse" } } } }
        "404": { $ref: "#/components/responses/ExecutionNotFound" }
        "409": { $ref: "#/components/responses/ExecutionConflict" }
  /api/v1/workspace:
    get:
      operationId: getWorkspace
      summary: Get the local workspace and its preferences
      tags:
        - Workspace
      responses:
        "200":
          description: The local workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
  /api/v1/workspace/settings:
    patch:
      operationId: updateWorkspaceSettings
      summary: Update local workspace preferences
      tags:
        - Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSettingsUpdateRequest"
      responses:
        "200":
          description: The updated workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /api/v1/onboarding:
    post:
      operationId: completeOnboarding
      summary: Complete local workspace onboarding
      tags:
        - Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
      responses:
        "200":
          description: Onboarding was completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Check API and database availability
      tags:
        - System
      responses:
        "200":
          description: The API and database are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"
        "503":
          description: The database is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  parameters:
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DayTypeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntityVersion:
      name: version
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
  responses:
    InvalidRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    WorkspaceNotFound:
      description: The local workspace does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    WorkspaceConflict:
      description: The workspace was changed or onboarding is already complete.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    CategoryNotFound:
      description: The category does not exist in the local workspace.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    CategoryConflict:
      description: The category name or version conflicts with current state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    DayTypeNotFound:
      description: The day type does not exist in the local workspace.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    DayTypeConflict:
      description: The day type name or version conflicts with current state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    WeeklyPlanConflict:
      description: Workspace settings changed before the weekly plan was saved.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    TaskNotFound:
      description: The task does not exist in the local workspace.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetail" } } }
    TaskConflict:
      description: The task version conflicts with current state.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetail" } } }
    DailyPlanConflict:
      description: The weekday has no day type or the plan version is stale.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetail" } } }
    ExecutionNotFound:
      description: The execution session or daily item does not exist.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetail" } } }
    ExecutionConflict:
      description: Another execution is active or the supplied version is stale.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetail" } } }
  schemas:
    ExecutionStateResponse:
      type: object
      additionalProperties: false
      required: [date, timezone, activeSession, sessions]
      properties:
        date: { type: string, format: date }
        timezone: { type: string }
        activeSession:
          oneOf: [{ $ref: "#/components/schemas/ExecutionSession" }, { type: "null" }]
        sessions: { type: array, items: { $ref: "#/components/schemas/ExecutionSession" } }
    ExecutionSession:
      type: object
      additionalProperties: false
      required: [id, taskId, taskTitle, dailyPlanItemId, startedAt, endedAt, version, durationSeconds]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        taskTitle: { type: string }
        dailyPlanItemId: { type: [string, "null"], format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
        durationSeconds: { type: integer, format: int64, minimum: 0 }
    ExecutionStartRequest:
      type: object
      additionalProperties: false
      required: [dailyPlanItemId]
      properties:
        dailyPlanItemId: { type: string, format: uuid }
        startedAt: { type: [string, "null"], format: date-time }
    ExecutionFinishRequest:
      type: object
      additionalProperties: false
      required: [sessionId, version]
      properties:
        sessionId: { type: string, format: uuid }
        endedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    ExecutionTransitionRequest:
      type: object
      additionalProperties: false
      required: [sessionId, nextDailyPlanItemId, version]
      properties:
        sessionId: { type: string, format: uuid }
        nextDailyPlanItemId: { type: string, format: uuid }
        occurredAt: { type: [string, "null"], format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    DailyPlanResponse:
      type: object
      additionalProperties: false
      required: [id, date, timezone, sourceDayTypeId, sourceDayTypeName, status, version, generatedAt, blocks, warnings]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        timezone: { type: string }
        sourceDayTypeId: { type: string, format: uuid }
        sourceDayTypeName: { type: string }
        status: { type: string, enum: [ACTIVE, COMPLETED] }
        version: { type: integer, format: int64, minimum: 0 }
        generatedAt: { type: string, format: date-time }
        blocks: { type: array, items: { $ref: "#/components/schemas/DailyPlanBlock" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/DailyPlanWarning" } }
    DailyPlanBlock:
      type: object
      additionalProperties: false
      required: [id, name, startMinute, endMinute, items]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        startMinute: { type: integer, minimum: 0, maximum: 1435 }
        endMinute: { type: integer, minimum: 5, maximum: 1440 }
        items: { type: array, items: { $ref: "#/components/schemas/DailyPlanItem" } }
    DailyPlanItem:
      type: object
      additionalProperties: false
      required: [id, taskId, taskTitle, taskType, importance, plannedStartMinute, plannedEndMinute, status]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        taskTitle: { type: string }
        taskType: { $ref: "#/components/schemas/TaskType" }
        importance: { type: integer, minimum: 1, maximum: 5 }
        plannedStartMinute: { type: integer }
        plannedEndMinute: { type: integer }
        status: { type: string, enum: [PLANNED, ACTIVE, COMPLETED, SKIPPED] }
    DailyPlanWarning:
      type: object
      additionalProperties: false
      required: [taskId, reasonCode, unallocatedMinutes, detail]
      properties:
        taskId: { type: string, format: uuid }
        reasonCode: { type: string }
        unallocatedMinutes: { type: integer, minimum: 5 }
        detail: { type: string }
    TaskType:
      type: string
      enum: [WORK_ITEM, HABIT]
    TaskStatus:
      type: string
      enum: [ACTIVE, COMPLETED, ARCHIVED]
    TaskCategory:
      type: object
      additionalProperties: false
      required: [id, name, color, icon, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        icon: { type: [string, "null"] }
        archived: { type: boolean }
    TaskResponse:
      type: object
      additionalProperties: false
      required: [id, type, title, description, importance, status, totalRequiredMinutes, deadline, weeklyTargetMinutes, categories, version, completedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/TaskType" }
        title: { type: string }
        description: { type: [string, "null"] }
        importance: { type: integer, minimum: 1, maximum: 5 }
        status: { $ref: "#/components/schemas/TaskStatus" }
        totalRequiredMinutes: { type: [integer, "null"], minimum: 5 }
        deadline: { type: [string, "null"], format: date }
        weeklyTargetMinutes: { type: [integer, "null"], minimum: 5 }
        categories: { type: array, items: { $ref: "#/components/schemas/TaskCategory" } }
        version: { type: integer, format: int64, minimum: 0 }
        completedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskWriteRequest:
      type: object
      additionalProperties: false
      required: [type, title, importance, categoryIds]
      properties:
        type: { $ref: "#/components/schemas/TaskType" }
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 2000 }
        importance: { type: integer, minimum: 1, maximum: 5 }
        totalRequiredMinutes: { type: [integer, "null"], minimum: 5 }
        deadline: { type: [string, "null"], format: date }
        weeklyTargetMinutes: { type: [integer, "null"], minimum: 5 }
        categoryIds: { type: array, maxItems: 64, uniqueItems: true, items: { type: string, format: uuid } }
        version: { type: [integer, "null"], format: int64, minimum: 0 }
    WeeklyPlanResponse:
      type: object
      additionalProperties: false
      required: [version, complete, days]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        complete:
          type: boolean
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/WeeklyPlanDay"
    WeeklyPlanDay:
      type: object
      additionalProperties: false
      required: [dayOfWeek, dayType]
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
        dayType:
          oneOf:
            - $ref: "#/components/schemas/WeeklyPlanDayType"
            - type: "null"
    WeeklyPlanDayType:
      type: object
      additionalProperties: false
      required: [id, name, color, archived, blockCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        archived:
          type: boolean
        blockCount:
          type: integer
          minimum: 1
    WeeklyPlanUpdateRequest:
      type: object
