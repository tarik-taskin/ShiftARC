openapi: 3.1.0
info:
  title: ShiftARC API
  version: 0.1.0
  description: Contract for the local ShiftARC planning application API.
servers:
  - url: /
security: []
paths:
  /api/v1/categories:
    get:
      operationId: listCategories
      summary: List local workspace categories
      tags:
        - Categories
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          schema:
            type: string
            maxLength: 80
            default: ""
      responses:
        "200":
          description: Categories ordered by archive state and name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
    post:
      operationId: createCategory
      summary: Create a category
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/CategoryConflict"
  /api/v1/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    put:
      operationId: updateCategory
      summary: Update a category
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdateRequest"
      responses:
        "200":
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "409":
          $ref: "#/components/responses/CategoryConflict"
    delete:
      operationId: archiveCategory
      summary: Archive a category without deleting its history
      tags:
        - Categories
      parameters:
        - $ref: "#/components/parameters/EntityVersion"
      responses:
        "204":
          description: Category archived.
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "409":
          $ref: "#/components/responses/CategoryConflict"
  /api/v1/categories/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      operationId: restoreCategory
      summary: Restore an archived category
      tags:
        - Categories
      parameters:
        - $ref: "#/components/parameters/EntityVersion"
      responses:
        "200":
          description: Category restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "409":
          $ref: "#/components/responses/CategoryConflict"
  /api/v1/workspace:
    get:
      operationId: getWorkspace
      summary: Get the local workspace and its preferences
      tags:
        - Workspace
      responses:
        "200":
          description: The local workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
  /api/v1/workspace/settings:
    patch:
      operationId: updateWorkspaceSettings
      summary: Update local workspace preferences
      tags:
        - Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSettingsUpdateRequest"
      responses:
        "200":
          description: The updated workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /api/v1/onboarding:
    post:
      operationId: completeOnboarding
      summary: Complete local workspace onboarding
      tags:
        - Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
      responses:
        "200":
          description: Onboarding was completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Check API and database availability
      tags:
        - System
      responses:
        "200":
          description: The API and database are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"
        "503":
          description: The database is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  parameters:
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntityVersion:
      name: version
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
  responses:
    InvalidRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    WorkspaceNotFound:
      description: The local workspace does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    WorkspaceConflict:
      description: The workspace was changed or onboarding is already complete.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    CategoryNotFound:
      description: The category does not exist in the local workspace.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    CategoryConflict:
      description: The category name or version conflicts with current state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
  schemas:
    CategoryResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - color
        - archived
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        icon:
          type:
            - string
            - "null"
          maxLength: 64
        archived:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
    CategoryCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - color
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        icon:
          type:
            - string
            - "null"
          maxLength: 64
    CategoryUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - color
        - version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        icon:
          type:
            - string
            - "null"
          maxLength: 64
        version:
          type: integer
          format: int64
          minimum: 0
    WorkspaceResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - timezone
        - weekStartsOn
        - themeId
        - backgroundMode
        - onboardingCompleted
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
          example: Europe/Istanbul
        weekStartsOn:
          type: integer
          minimum: 1
          maximum: 7
          example: 1
        themeId:
          $ref: "#/components/schemas/ThemeId"
        backgroundMode:
          $ref: "#/components/schemas/BackgroundMode"
        onboardingCompleted:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
    WorkspaceSettingsUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - timezone
        - themeId
        - backgroundMode
        - version
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        themeId:
          $ref: "#/components/schemas/ThemeId"
        backgroundMode:
          $ref: "#/components/schemas/BackgroundMode"
        version:
          type: integer
          format: int64
          minimum: 0
    OnboardingRequest:
      type: object
      additionalProperties: false
      required:
        - timezone
        - themeId
        - backgroundMode
        - includeSampleData
        - version
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        themeId:
          $ref: "#/components/schemas/ThemeId"
        backgroundMode:
          $ref: "#/components/schemas/BackgroundMode"
        includeSampleData:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
    ThemeId:
      type: string
      enum:
        - arc-midnight
        - dawn
        - aurora
    BackgroundMode:
      type: string
      enum:
        - TIME_AWARE
        - STATIC
    SystemStatusResponse:
      type: object
      additionalProperties: false
      required:
        - service
        - version
        - status
        - database
      properties:
        service:
          type: string
          example: shiftarc-api
        version:
          type: string
          example: 0.1.0
        status:
          $ref: "#/components/schemas/ComponentStatus"
        database:
          $ref: "#/components/schemas/ComponentStatus"
    ComponentStatus:
      type: string
      enum:
        - UP
    ProblemDetail:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
